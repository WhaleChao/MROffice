# Build the editors and publish them as the live demo (https://demo.mroffice.ai)
# on every push to main.
name: Live demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Office substitute fonts
        run: npm run fonts
      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      - name: The README's tour video, served where a browser plays it
        run: mkdir -p apps/playground/dist/media && cp docs/media/mr-office-demo.mp4 apps/playground/dist/media/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/playground/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
